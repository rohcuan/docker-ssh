version: "3.8"

services:
  vibecoding-v1:
    image: quay.io/toolbx-images/debian-toolbox:12
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - vibecoding-v1-data:/data
    networks:
      - common-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

networks:
  common-overlay:
    external: true

volumes:
  vibecoding-v1-data:
    name: vibecoding-v1-data
