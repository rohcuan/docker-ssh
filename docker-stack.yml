version: "3.8"

services:
  vibecoding-v1:
    image: debian:12
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        URL=https://raw.githubusercontent.com/rohcuan/docker-ssh/main/entrypoint.sh
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL -o /entrypoint.sh "$URL"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO /entrypoint.sh "$URL"
        else
          apt-get update && apt-get install -y curl
          curl -fsSL -o /entrypoint.sh "$URL"
        fi
        chmod +x /entrypoint.sh
        exec /entrypoint.sh
    volumes:
      - vibecoding-v1-data:/data
    networks:
      - common-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == stb1

networks:
  common-overlay:
    external: true

volumes:
  vibecoding-v1-data:
    name: vibecoding-v1-data
