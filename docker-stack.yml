version: "3.8"

services:
  vibecoding-v1:
    image: debian:12
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        apt-get update -qq &&
        apt-get install -y -qq curl &&
        curl -fsSL -o /entrypoint.sh https://raw.githubusercontent.com/rohcuan/docker-ssh/main/entrypoint.sh &&
        chmod +x /entrypoint.sh &&
        exec /entrypoint.sh
    volumes:
      - vibecoding-v1-data:/data
    networks:
      - common-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == stb1

networks:
  common-overlay:
    external: true

volumes:
  vibecoding-v1-data:
    name: vibecoding-v1-data
